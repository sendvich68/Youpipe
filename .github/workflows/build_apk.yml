name: Build YouPipe APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_API: 33
  ANDROID_BUILD_TOOLS: "33.0.2"
  NDK_VERSION: "25.2.9519653"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "ndk;${{ env.NDK_VERSION }}" \
            "platform-tools"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build native library (aarch64)
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            --platform ${{ env.ANDROID_API }} \
            -o android/app/src/main/jniLibs/arm64-v8a \
            build --release

      - name: Build native library (armv7)
        run: |
          cargo ndk \
            --target armv7-linux-androideabi \
            --platform ${{ env.ANDROID_API }} \
            -o android/app/src/main/jniLibs/armeabi-v7a \
            build --release

      - name: Build native library (x86_64)
        run: |
          cargo ndk \
            --target x86_64-linux-android \
            --platform ${{ env.ANDROID_API }} \
            -o android/app/src/main/jniLibs/x86_64 \
            build --release

      - name: Setup Gradle project
        run: |
          mkdir -p android/app/src/main/jniLibs
          cat > android/settings.gradle <<'EOF'
          rootProject.name = "YouPipe"
          include ":app"
          EOF

          cat > android/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.youpipe'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.youpipe"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "0.1.0"
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              sourceSets {
                  main {
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                      jniLibs.srcDirs = ['src/main/jniLibs']
                  }
              }
          }
          EOF

          cp android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Setup Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5 || {
            # если gradle не установлен, качаем wrapper вручную
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          }

      - name: Build APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youpipe-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youpipe-logs
          path: |
            android/app/build/outputs/logs/*.txt
          if-no-files-found: ignore
