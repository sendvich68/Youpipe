[package]
name = "youpipe"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "youpipe"

[[bin]]
name = "youpipe"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["eframe", "gstreamer", "gstreamer-video", "rfd"]

[dependencies]
egui = "0.27"
log = "0.4"
env_logger = "0.11"

# Desktop-only
eframe = { version = "0.27", optional = true, default-features = false, features = ["glow", "default_fonts"] }
gstreamer = { version = "0.22", optional = true }
gstreamer-video = { version = "0.22", optional = true }
rfd = { version = "0.14", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.5", features = ["native-activity"] }
ndk = "0.8"
ndk-sys = "0.5"
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
