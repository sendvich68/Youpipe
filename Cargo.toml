[package]
name = "youpipe"
version = "0.1.0"
edition = "2021"
description = "YouPipe — video viewer app"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.27"
gstreamer = "0.22"
gstreamer-video = "0.22"
gstreamer-app = "0.22"
log = "0.4"
env_logger = "0.11"
rfd = "0.14"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.5", features = ["native-activity"] }
ndk = "0.8"
ndk-glue = "0.7"
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
